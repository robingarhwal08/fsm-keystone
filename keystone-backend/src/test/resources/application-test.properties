# Test profile properties — activated with @ActiveProfiles("test") in fixture tests.
# This file defines a test-only JWT secret used by TestJwtFactory.
# No real secrets may appear here; all values are synthetic test-only placeholders.

spring.application.name=keystone-test

# CORS (required by SecurityConfig @Value)
app.cors.allowed-origin=http://localhost:5173

# JWT — test-only 64-char secret. The production secret is never committed anywhere.
# TestJwtFactory.TEST_SECRET must equal this value so tokens produced outside
# the Spring context validate when the context uses this profile.
app.jwt.secret=test-fixture-jwt-secret-key-must-be-at-least-64-chars-00000000
app.jwt.expiration-ms=3600000

# JPA — Hibernate creates the schema against Testcontainers; no Flyway migrations needed.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# DataSource — overridden by @ServiceConnection/@DynamicPropertySource in Testcontainers tests.
spring.datasource.url=
spring.datasource.username=
spring.datasource.password=

# Flyway — disabled in fixture tests; schema managed by Hibernate ddl-auto.
spring.flyway.enabled=false
