# Test application properties — override production values with safe placeholders.
# No real secrets must appear in this file.

spring.application.name=keystone-test

# CORS (required by SecurityConfig @Value)
app.cors.allowed-origin=http://localhost:5173

# JWT (placeholder — never the production key)
app.jwt.secret=test-placeholder-jwt-secret-key-must-be-at-least-64-characters-long-00000000
app.jwt.expiration-ms=3600000

# JPA — use update so Hibernate creates the schema against the Testcontainers instance
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Suppress H2 auto-configuration noise in web-slice tests
spring.datasource.url=
spring.datasource.username=
spring.datasource.password=

# Flyway — mirror the main profile's strict settings in the test environment.
# @ServiceConnection or @DynamicPropertySource on integration tests supplies the real datasource URL.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=true
spring.flyway.out-of-order=false
