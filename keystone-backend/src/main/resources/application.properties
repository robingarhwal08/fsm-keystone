spring.application.name=${SPRING_APPLICATION_NAME:keystone}

server.port=${PORT:8080}

# Configtree secrets — Docker Compose mounts /run/secrets/<property-key> files.
# The 'optional:' prefix allows startup without the directory (env vars are used instead).
# Precedence (highest → lowest): configtree file > env var > application.properties default.
spring.config.import=optional:configtree:/run/secrets/

# PostgreSQL
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/fsmdb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:robin8181}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=${SPRING_JPA_FORMAT_SQL:true}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT
app.jwt.secret=${APP_JWT_SECRET:8b7a0c7e860f49c19cab6c1e3708be02046d096f376b1f45202f5061ffdd5ee3}
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:86400000}

# CORS
app.cors.allowed-origin=${APP_CORS_ALLOWED_ORIGIN:http://localhost:5173}

# Actuator — minimal exposure; env/beans/heapdump must never be reachable over HTTP.
# /actuator/prometheus is on the same port but protected by anyRequest().authenticated().
management.endpoints.web.exposure.include=${MANAGEMENT_ENDPOINTS_INCLUDE:health,info,prometheus}
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=when_authorized
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
# Liveness excludes db so a PostgreSQL outage does not trigger a JVM restart loop.
management.endpoint.health.group.liveness.include=livenessState
# Readiness includes db so the container is only marked healthy when the pool is usable.
management.endpoint.health.group.readiness.include=readinessState,db
# Emit per-bucket histograms so p50/p95/p99 latency is queryable in Prometheus.
management.metrics.distribution.percentiles-histogram.http.server.requests=true

# HikariCP — explicit pool sizing; two replicas consume 40 of PostgreSQL's default 100 max_connections.
# All values are environment-overridable; no secret defaults.
spring.datasource.hikari.maximum-pool-size=${HIKARI_MAX_POOL_SIZE:20}
spring.datasource.hikari.minimum-idle=${HIKARI_MIN_IDLE:5}
spring.datasource.hikari.connection-timeout=${HIKARI_CONNECTION_TIMEOUT:3000}
spring.datasource.hikari.max-lifetime=${HIKARI_MAX_LIFETIME:1800000}

# Flyway — schema migration authority (SOC 2 audit compliance).
# clean-disabled must stay true in every profile; a misconfigured env must never drop the schema.
# Do not change ddl-auto here; that is scoped to WO-043 after the baseline SQL lands.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=true
spring.flyway.out-of-order=false