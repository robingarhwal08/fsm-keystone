spring.application.name=keystone
server.port=8080

# PostgreSQL connection. Change database/user/password as per your local setup.
spring.datasource.url=jdbc:postgresql://localhost:5432/fsmdb
spring.datasource.username=postgres
spring.datasource.password=robin8181
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT secret must be at least 256-bit. Replace this in production.
app.jwt.secret=8b7a0c7e860f49c19cab6c1e3708be02046d096f376b1f45202f5061ffdd5ee3
app.jwt.expiration-ms=86400000

# Frontend origin for local development
app.cors.allowed-origin=http://localhost:5173
