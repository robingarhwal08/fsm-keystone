# Dev / test profile — allows Flyway to baseline an existing database that has no
# flyway_schema_history table yet (i.e. a database that pre-dates this migration setup).
# baseline-on-migrate=true is safe here because dev databases are disposable.
# The baseline SQL (V1 DDL snapshot) arrives in WO-041; this setting lets devs start
# the application against a legacy-shaped database before that migration lands.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
